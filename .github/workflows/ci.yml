name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Quality Checks
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ShoSho.slnx

      - name: Restore local dotnet tools
        run: dotnet tool restore

      - name: Build solution (Release, warnings as errors)
        run: dotnet build ShoSho.slnx -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run unit tests with coverage
        run: >
          dotnet test ShoSho.Tests/ShoSho.Tests.csproj
          -c Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Run SQLite smoke tests
        run: dotnet run --project tests/ShoSho.SqliteSmoke/ShoSho.SqliteSmoke.csproj -c Release --no-build

      - name: Run WPF UI smoke tests
        run: dotnet run --project tests/ShoSho.UiSmoke/ShoSho.UiSmoke.csproj -c Release --no-build

      - name: Check NuGet package vulnerabilities
        run: dotnet list ShoSho.slnx package --vulnerable --include-transitive

      # Non-blocking until existing whitespace differences are formatted with `dotnet format ShoSho.slnx`
      - name: Check code formatting
        shell: pwsh
        run: |
          dotnet format ShoSho.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::notice::Code formatting differences detected. Run 'dotnet format ShoSho.slnx' to fix."
            exit 0
          }

      - name: Verify release publish (win-x64)
        run: dotnet publish src/ShoSho.UI/ShoSho.UI.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Upload Windows publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: shosho-win-x64
          path: publish/
